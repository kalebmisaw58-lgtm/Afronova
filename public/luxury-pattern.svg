<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Pure white background base -->
  <rect width="80" height="80" fill="#FFFFFF" />
  
  <!-- Ultra-soft luxury pattern layer (subtle 38% opacity whisper texture) -->
  <g opacity="0.38">
    <!-- Soft warm ivory center diamond tile -->
    <polygon points="40,0 80,40 40,80 0,40" fill="#F3ECE0" />
    
    <!-- Soft gold center dot -->
    <circle cx="40" cy="40" r="5.5" fill="#DFD0AF" />
    
    <!-- Whisper-soft diagonal grid lines -->
    <path d="M40 0 L80 40 M0 40 L40 80 M40 0 L0 40 M80 40 L40 80" stroke="#E2D6C0" stroke-width="0.65" />
  </g>
</svg>
